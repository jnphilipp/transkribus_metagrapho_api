name: Update requirements

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  update-requirements:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository with update-requirements branch
        uses: actions/checkout@v7
        id: checkout-branch
        continue-on-error: true
        with:
          ref: update-requirements
      - name: Checkout repository fallback to main branch
        if: steps.checkout-branch.outcome == 'failure'
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Configure git via gh and set user
        run: |
          gh auth setup-git
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git config user.name "${{ github.actor }}"
      - name: Create/update branch and install tools
        run: |
          git checkout -B update-requirements
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install pip-tools
      - name: Compile requirements
        run: |
          source venv/bin/activate
          pip-compile -U --no-annotate --strip-extras requirements.in
      - name: Commit and push if changed
        run: |
          git add requirements.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update requirements."
            git push --set-upstream origin update-requirements

            # Check if a PR from this branch already exists
            PR_EXISTS=$(gh pr list --head update-requirements --base main --json number --jq 'length')

            if [ "$PR_EXISTS" -eq 0 ]; then
              gh pr create --base main --head update-requirements --title "Update requirements" --body "This pull request updates the requirements.txt and was automatically created by a workflow action." --assignee "${{ github.actor }}"
            else
              echo "Pull request already exists for branch update-requirements."
            fi
          fi
